<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --primary: #1a365d;
            --accent: #2b6cb0;
            --correct: #2f855a;
            --incorrect: #c53030;
            --text: #2d3748;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .quiz-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 850px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-card {
            margin-bottom: 25px;
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 18px;
            color: var(--primary);
            line-height: 1.4;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
        }

        .option-btn:hover:not([disabled]) {
            background-color: #edf2f7;
            border-color: #cbd5e0;
        }

        .option-btn.selected-correct {
            background-color: #c6f6d5;
            border-color: var(--correct);
            color: #22543d;
            font-weight: bold;
        }

        .option-btn.selected-incorrect {
            background-color: #fed7d7;
            border-color: var(--incorrect);
            color: #742a2a;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #2c5282;
        }

        .btn:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
        }

        .results-section {
            text-align: center;
            display: none;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent);
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-screen">
        <h1>MAPEH Complete Reviewer Quiz</h1>
        <div class="subtitle">Exhaustive 100-Item Assessment</div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="question-card">
            <div class="question-title" id="question-text">Question loading...</div>
            <div class="options-container" id="options-container"></div>
        </div>

        <div class="controls">
            <span id="question-counter">Question 1 of 100</span>
            <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>Next</button>
        </div>
    </div>

    <div id="results-screen" class="results-section">
        <h1>Quiz Complete!</h1>
        <p>Your final score is:</p>
        <div class="score-display" id="final-score">0 / 100</div>
        <p id="feedback-text"></p>
        <button class="btn" onclick="restartQuiz()">Restart Quiz</button>
    </div>
</div>

let currentQuestionIndex = 0;
let score = 0;
let selectedOption = null;

const questionText = document.getElementById('question-text');
const optionsContainer = document.getElementById('options-container');
const nextBtn = document.getElementById('next-btn');
const progressFill = document.getElementById('progress-fill');
const questionCounter = document.getElementById('question-counter');

function loadQuestion() {
    selectedOption = null;
    nextBtn.disabled = true;
    
    const q = quizData[currentQuestionIndex];
    questionText.textContent = `${currentQuestionIndex + 1}. ${q.question}`;
    
    optionsContainer.innerHTML = '';
    q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => selectOption(index, btn);
        optionsContainer.appendChild(btn);
    });

    questionCounter.textContent = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
    progressFill.style.width = `${((currentQuestionIndex) / quizData.length) * 100}%`;
}

function selectOption(index, button) {
    if (selectedOption !== null) return;
    
    selectedOption = index;
    const correctIndex = quizData[currentQuestionIndex].correct;
    const buttons = optionsContainer.children;

    if (index === correctIndex) {
        button.classList.add('selected-correct');
        score++;
    } else {
        button.classList.add('selected-incorrect');
        buttons[correctIndex].classList.add('selected-correct');
    }

    for (let btn of buttons) {
        btn.disabled = true;
    }

    nextBtn.disabled = false;
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < quizData.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('results-screen').style.display = 'block';
    document.getElementById('final-score').textContent = `${score} / ${quizData.length}`;
    
    const percentage = (score / quizData.length) * 100;
    let feedback = "";
    if (percentage >= 90) feedback = "Flawless Mastery! You know every single line item across all 14 pages!";
    else if (percentage >= 75) feedback = "Great job! High proficiency across all MAPEH sections.";
    else if (percentage >= 50) feedback = "Solid effort! Re-read the missed terms in the reviewer and try again.";
    else feedback = "Keep studying! Review the document thoroughly and take the quiz again.";
    
    document.getElementById('feedback-text').textContent = feedback;
}

function restartQuiz() {
    currentQuestionIndex = 0;
    score = 0;
    document.getElementById('results-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
