<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAPEH Comprehensive Reviewer Quiz</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #2c3e50;
            --accent: #3498db;
            --correct: #2ecc71;
            --incorrect: #e74c3c;
            --text: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .quiz-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #ecf0f1;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-card {
            margin-bottom: 25px;
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not([disabled]) {
            background-color: #e9ecef;
            border-color: #ced4da;
        }

        .option-btn.selected-correct {
            background-color: #d4edda;
            border-color: var(--correct);
            color: #155724;
            font-weight: bold;
        }

        .option-btn.selected-incorrect {
            background-color: #f8d7da;
            border-color: var(--incorrect);
            color: #721c24;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        .results-section {
            text-align: center;
            display: none;
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent);
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-screen">
        <h1>MAPEH Reviewer Quiz</h1>
        <div class="subtitle">Music, Arts, Physical Education & Health</div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="question-card">
            <div class="question-title" id="question-text">Question loading...</div>
            <div class="options-container" id="options-container"></div>
        </div>

        <div class="controls">
            <span id="question-counter">Question 1 of 15</span>
            <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>Next</button>
        </div>
    </div>

    <div id="results-screen" class="results-section">
        <h1>Quiz Complete!</h1>
        <p>Your final score is:</p>
        <div class="score-display" id="final-score">0 / 0</div>
        <p id="feedback-text"></p>
        <button class="btn" onclick="restartQuiz()">Restart Quiz</button>
    </div>
</div>

<script>
const quizData = [
    {
        question: "Which masterpiece by Fernando Amorsolo depicts a traditional rural Filipino scene and is considered his most celebrated painting?",
        options: ["The Parisian Life", "Planting Rice", "Spoliarium", "The Invasion of Limahong"],
        correct: 1
    },
    {
        question: "What Latin word does 'Art' originate from, meaning skill or craft?",
        options: ["Medium", "Ars", "Zeitgeist", "Design"],
        correct: 1
    },
    {
        question: "Which classic 1982 Filipino film directed by Ishmael Bernal starred Nora Aunor as a young woman believed to have miraculous powers?",
        options: ["Maynila sa Kuko ng Liwanag", "Himala", "Birdshot", "Fan Girl"],
        correct: 1
    },
    {
        question: "What is the highest tier of fashion, characterized by exclusive, custom-fitted garments made entirely by hand?",
        options: ["Prêt-à-Porter", "Mass Market", "Haute Couture", "Fast Fashion"],
        correct: 2
    },
    {
        question: "Which designer created the iconic 'Lava Gown' worn by Miss Universe 2018 Catriona Gray?",
        options: ["Patis Tesoro", "Rajo Laurel", "Mak Tumang", "Rian Fernandez"],
        correct: 2
    },
    {
        question: "What type of lines in art move flatly from left to right?",
        options: ["Vertical Lines", "Diagonal Lines", "Spiral Lines", "Horizontal Lines"],
        correct: 3
    },
    {
        question: "Sir Isaac Newton's work with light and prisms in the 1660s proved that white light is actually composed of what?",
        options: ["Pure colorless energy", "A combination of all rainbow colors", "Only primary pigments", "Ultraviolet spectrums"],
        correct: 1
    },
    {
        question: "Which design principle refers to the distribution of visual weight (symmetrical, asymmetrical, or radial)?",
        options: ["Emphasis", "Contrast", "Balance", "Rhythm"],
        correct: 2
    },
    {
        question: "Where and when was the first known video-game tournament, the 'Intergalactic Spacewar Olympics', held?",
        options: ["MIT (1962)", "Stanford University (1972)", "Atari HQ (1980)", "Tokyo (1978)"],
        correct: 1
    },
    {
        question: "How long does the postpartum phase typically last after childbirth?",
        options: ["2 weeks", "6 weeks", "9 months", "1000 days"],
        correct: 1
    },
    {
        question: "Which essential nutrient is critical before conception and through early pregnancy to prevent neural tube defects?",
        options: ["Folic Acid", "Calcium", "Vitamin D", "Bilirubin"],
        correct: 0
    },
    {
        question: "Republic Act 11210 (105-Day Expanded Maternity Leave Law) grants working mothers how many days of fully paid maternity leave?",
        options: ["60 days", "90 days", "105 days", "120 days"],
        correct: 2
    },
    {
        question: "Which law focuses on comprehensive health care for mothers and newborns during the crucial 'First 1,000 Days' of life?",
        options: ["RA 9262", "RA 11148", "RA 10354", "RA 11861"],
        correct: 1
    },
    {
        question: "What gold-medal-winning masterpiece by Juan Luna depicts dead gladiators being dragged into a dark Roman basement?",
        options: ["The Death of Cleopatra", "Spoliarium", "Planting Rice", "The Parisian Life"],
        correct: 1
    },
    {
        question: "Which Republic Act guarantees non-discrimination and safeguards the rights of women in the Philippines (Magna Carta of Women)?",
        options: ["RA 9710", "RA 7610", "RA 11930", "RA 11642"],
        correct: 0
    }
];

let currentQuestionIndex = 0;
let score = 0;
let selectedOption = null;

const questionText = document.getElementById('question-text');
const optionsContainer = document.getElementById('options-container');
const nextBtn = document.getElementById('next-btn');
const progressFill = document.getElementById('progress-fill');
const questionCounter = document.getElementById('question-counter');

function loadQuestion() {
    selectedOption = null;
    nextBtn.disabled = true;
    
    const q = quizData[currentQuestionIndex];
    questionText.textContent = `${currentQuestionIndex + 1}. ${q.question}`;
    
    optionsContainer.innerHTML = '';
    q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => selectOption(index, btn);
        optionsContainer.appendChild(btn);
    });

    questionCounter.textContent = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
    progressFill.style.width = `${((currentQuestionIndex) / quizData.length) * 100}%`;
}

function selectOption(index, button) {
    if (selectedOption !== null) return;
    
    selectedOption = index;
    const correctIndex = quizData[currentQuestionIndex].correct;
    const buttons = optionsContainer.children;

    if (index === correctIndex) {
        button.classList.add('selected-correct');
        score++;
    } else {
        button.classList.add('selected-incorrect');
        buttons[correctIndex].classList.add('selected-correct');
    }

    for (let btn of buttons) {
        btn.disabled = true;
    }

    nextBtn.disabled = false;
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < quizData.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('results-screen').style.display = 'block';
    document.getElementById('final-score').textContent = `${score} / ${quizData.length}`;
    
    const percentage = (score / quizData.length) * 100;
    let feedback = "";
    if (percentage >= 80) feedback = "Outstanding! You mastered the MAPEH material!";
    else if (percentage >= 50) feedback = "Good effort! Review the sections you missed.";
    else feedback = "Keep reviewing! Re-read the MAPEH notes and try again.";
    
    document.getElementById('feedback-text').textContent = feedback;
}

function restartQuiz() {
    currentQuestionIndex = 0;
    score = 0;
    document.getElementById('results-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
